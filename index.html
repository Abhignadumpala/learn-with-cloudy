<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNS Step by Step</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Telugu:wght@400..700&family=Noto+Sans+Devanagari:wght@400..700&display=swap">
<style>
/* Layout: one stage (16:9 SVG diagram) with caption + terminal line under it, scene list above, transport controls below. */
:root {
  --bg: #eef2f4; --panel: #ffffff; --ink: #18242e; --muted: #5a6b78; --line: #c6d1d8;
  --accent: #0d7480; --accent-tint: #dcf0f1; --pkt: #e39b16; --pkt-ink: #2a1c00;
  --ok: #2c8a4b; --ok-tint: #e1f3e6; --bad: #c4413a; --bad-tint: #fbe5e3; --term: #102029; --term-ink: #cfe9ec;
  --display: "Archivo", "Noto Sans Telugu", "Noto Sans Devanagari", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e161c; --panel: #16222b; --ink: #e4ecf1; --muted: #93a4b0; --line: #2d3d49;
  --accent: #43b9c3; --accent-tint: #123840; --pkt: #f2b53a; --pkt-ink: #261900;
  --ok: #51c477; --ok-tint: #143523; --bad: #f06c63; --bad-tint: #3d1a18; --term: #070d11; --term-ink: #bfe3e7; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e161c; --panel: #16222b; --ink: #e4ecf1; --muted: #93a4b0; --line: #2d3d49;
  --accent: #43b9c3; --accent-tint: #123840; --pkt: #f2b53a; --pkt-ink: #261900;
  --ok: #51c477; --ok-tint: #143523; --bad: #f06c63; --bad-tint: #3d1a18; --term: #070d11; --term-ink: #bfe3e7; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--display); font-stretch: 100%; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 40px; display: grid; gap: 16px; }

header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
header.top h1 { margin: 0; font-size: clamp(1.5rem, 3.4vw, 2.1rem); font-weight: 800; font-stretch: 78%; letter-spacing: -0.01em; text-wrap: balance; }
header.top p { margin: 0; color: var(--muted); font-size: 0.95rem; }
header.top .zone { font-family: var(--mono); font-size: 0.85rem; color: var(--accent); }

nav.scenes { display: flex; flex-wrap: wrap; gap: 8px; }
nav.scenes button { font: inherit; font-size: 0.9rem; font-weight: 600; font-stretch: 85%; color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; display: inline-flex; gap: 8px; align-items: baseline; }
nav.scenes button span { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
nav.scenes button[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
nav.scenes button[aria-current="true"] span { color: var(--bg); opacity: 0.7; }

.notes h2 { margin: 0 0 10px; font-size: 1.15rem; font-weight: 700; font-stretch: 85%; }
.ncards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 12px; }
.ncard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.ncard h3 { margin: 0; font-size: 1rem; font-weight: 700; font-stretch: 85%; color: var(--accent); text-wrap: balance; }
.ncard p { margin: 0; font-size: 0.92rem; line-height: 1.45; }
.ncard pre { margin: 4px 0 0; font: 500 0.78rem/1.45 var(--mono); background: var(--term); color: var(--term-ink); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
html.rec .notes { display: none; }
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; }
.stage-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 20px 0; flex-wrap: wrap; }
.stage-head h2 { margin: 0; font-size: 1.25rem; font-weight: 700; font-stretch: 85%; text-wrap: balance; }
.stage-head .n { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); letter-spacing: 0.04em; }
.svgbox { width: 100%; aspect-ratio: 16 / 9; max-width: 100%; }
.svgbox svg { width: 100%; height: 100%; display: block; }
.cap { padding: 4px 20px 16px; min-height: 5.6em; display: grid; gap: 8px; align-content: start; }
.cap p { margin: 0; font-size: clamp(1rem, 2.2vw, 1.25rem); line-height: 1.4; font-weight: 500; max-width: 60ch; text-wrap: pretty; }
.stage-body { display: grid; grid-template-columns: minmax(96px, 22%) 1fr; align-items: end; gap: 4px; padding-inline: 8px 0; }
.presenter { display: grid; justify-items: center; gap: 2px; align-self: end; padding-bottom: 6px; }
.presenter svg { width: 100%; max-width: 230px; height: auto; display: block; }
#cloudy { overflow: visible; }
.who { font-weight: 700; font-stretch: 85%; font-size: 0.95rem; color: var(--ink); text-align: center; }
.who span { font-weight: 500; color: var(--muted); }
#cloudy .halo { fill: var(--accent-tint); }
#cloudy .hoodie { fill: var(--accent); }
#cloudy .shade { fill: #000; opacity: 0.18; }
#cloudy .string { stroke: #fff; stroke-width: 3; stroke-linecap: round; opacity: 0.85; fill: none; }
#cloudy .logo, #cloudy .clip { fill: #fff; }
#cloudy .clip { stroke: #b9c7cf; stroke-width: 1; }
#cloudy .skin { fill: #d9a27c; }
#cloudy .hair { fill: #3a2418; }
#cloudy .brow { stroke: #3a2418; stroke-width: 3.2; stroke-linecap: round; fill: none; }
#cloudy .eye { fill: #1f1a2b; }
#cloudy .lash { stroke: #1f1a2b; stroke-width: 2.2; stroke-linecap: round; fill: none; }
#cloudy .shine { fill: #fff; }
#cloudy .blush { fill: #ef7f7f; opacity: 0.45; }
#cloudy .nose { stroke: #b87c58; stroke-width: 2.2; stroke-linecap: round; fill: none; }
#cloudy .lip { stroke: #7a2e2e; stroke-width: 3; stroke-linecap: round; fill: none; }
#cloudy .mouth { fill: #6e2328; }
#cloudy .tongue { fill: #e7787c; }
#cloudy g, #cloudy path, #cloudy ellipse { transition: none; }
.cap p { position: relative; background: var(--accent-tint); border-radius: 14px; padding: 12px 16px; }
.cap p::before { content: ""; position: absolute; left: 34px; top: -9px; border: 9px solid transparent; border-top: 0; border-bottom-color: var(--accent-tint); }
.cmd { font-family: var(--mono); font-size: 0.85rem; background: var(--term); color: var(--term-ink); border-radius: 8px; padding: 8px 12px;
  overflow-x: auto; white-space: pre; justify-self: start; max-width: 100%; }
.cmd::before { content: "$ "; opacity: 0.6; }

.transport { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.transport button { font: inherit; font-size: 0.9rem; font-weight: 600; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 14px; cursor: pointer; min-width: 44px; }
.transport button.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); min-width: 92px; }
.transport button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
button:focus-visible { outline: 3px solid var(--pkt); outline-offset: 2px; }
.dots { display: flex; gap: 6px; flex: 1 1 160px; min-width: 0; flex-wrap: wrap; }
.dots button { all: unset; cursor: pointer; width: 22px; height: 8px; border-radius: 4px; background: var(--line); }
.dots button.done { background: var(--accent); opacity: 0.45; }
.dots button.now { background: var(--accent); }
.dots button:focus-visible { outline: 2px solid var(--pkt); }
.keys { color: var(--muted); font-size: 0.8rem; font-family: var(--mono); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.transport .seg button { border: 0; border-radius: 0; min-width: 0; }
.transport .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.transport select { font: inherit; font-size: 0.9rem; font-weight: 600; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.vnote { color: var(--bad); font-size: 0.85rem; }
.scrub { display: flex; align-items: center; gap: 12px; }
.track { position: relative; flex: 1 1 auto; min-width: 0; height: 28px; display: flex; align-items: center; }
.track input { width: 100%; margin: 0; accent-color: var(--accent); height: 28px; cursor: pointer; touch-action: none; }
.track .mk { position: absolute; top: 4px; width: 2px; height: 6px; background: var(--muted); opacity: 0.6; pointer-events: none; transform: translateX(-1px); }
.time { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
html.rec .scrub { display: none; }

/* SVG */
.node rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; transition: fill .35s, stroke .35s; }
.node .nt { fill: var(--ink); font: 700 16px var(--display); font-stretch: 85%; }
.node .ns { fill: var(--muted); font: 500 12.5px var(--mono); }
.node[data-s="on"] rect { stroke: var(--accent); stroke-width: 2.5; fill: var(--accent-tint); }
.node[data-s="ok"] rect { stroke: var(--ok); stroke-width: 2.5; fill: var(--ok-tint); }
.node[data-s="bad"] rect { stroke: var(--bad); stroke-width: 2.5; fill: var(--bad-tint); }
.node[data-s="bad"] .ns { fill: var(--bad); }
.node[data-s="ok"] .ns { fill: var(--ok); }
.wire { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 6; transition: stroke .35s; }
.wire[data-s="on"] { stroke: var(--accent); stroke-dasharray: none; }
.row text { font: 500 13px var(--mono); fill: var(--ink); }
.row rect { fill: transparent; transition: fill .35s; }
.row[data-s="on"] rect { fill: var(--accent-tint); }
.row[data-s="ok"] rect { fill: var(--ok-tint); }
.row[data-s="bad"] rect { fill: var(--bad-tint); }
.row .ty { fill: var(--accent); font-weight: 600; }
.lbl { fill: var(--muted); font: 500 12.5px var(--mono); }
.big { fill: var(--ink); font: 700 15px var(--display); font-stretch: 85%; }
.tag { fill: var(--ok); font: 600 12px var(--mono); }
.panel { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
.banner rect { fill: var(--ok-tint); stroke: var(--ok); stroke-width: 1.5; }
.banner text { fill: var(--ink); font: 600 14.5px var(--display); font-stretch: 90%; }
.banner.warn rect { fill: var(--bad-tint); stroke: var(--bad); }
.pkt rect { fill: var(--pkt); }
.pkt text { fill: var(--pkt-ink); font: 600 12.5px var(--mono); }
.off { opacity: 0; transition: opacity .35s; pointer-events: none; }
g, text, path { transition: opacity .35s; }
svg text { white-space: pre; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* recording mode: fixed 1280x720 frame, no controls */
html.rec, html.rec body { width: 1280px; height: 720px; overflow: hidden; margin: 0; padding: 0; }
html.rec * { transition: none !important; }
html.rec .wrap { max-width: none; width: 1280px; height: 720px; padding: 0; gap: 0; }
html.rec header.top, html.rec nav.scenes, html.rec .transport, html.rec .keys { display: none; }
html.rec .stage { border: 0; border-radius: 0; height: 720px; grid-template-rows: auto 1fr auto; }
html.rec .stage-head { padding: 22px 40px 0; }
html.rec .stage-head h2 { font-size: 30px; }
html.rec .stage-head .n { font-size: 16px; }
html.rec .svgbox { aspect-ratio: auto; height: 100%; min-height: 0; }
html.rec .stage-body { grid-template-columns: 290px 1fr; min-height: 0; height: 100%; padding-inline: 20px 30px; }
html.rec .presenter svg { max-width: 270px; }
html.rec .who { font-size: 20px; }
html.rec .cap { padding: 4px 40px 24px; min-height: 0; height: 160px; }
html.rec .cap p { font-size: 25px; max-width: none; }
html.rec .cmd { font-size: 18px; }
</style>

/* ---------- state per step (cumulative patches) ---------- */
const durOf = s => Math.min(8.5, Math.max(3.6, 1.8 + s.cap.split(/\s+/).length * 0.3));
function prepare(sc, root) {
  const ids = new Set(), init = { vis: {}, s: {}, txt: {} };
  sc.steps.forEach(st => {
    (st.show || []).concat(st.hide || []).forEach(i => ids.add('v:' + i));
    Object.keys(st.set || {}).forEach(i => ids.add('s:' + i));
    Object.keys(st.txt || {}).forEach(i => ids.add('t:' + i));
  });
  ids.forEach(k => {
    const [kind, id] = [k[0], k.slice(2)], el = root.querySelector('#' + id);
    if (!el) return;
    if (kind === 'v') init.vis[id] = !el.classList.contains('off');
    if (kind === 's') init.s[id] = '';
    if (kind === 't') init.txt[id] = el.textContent;
  });
  let cur = { vis: { ...init.vis }, s: { ...init.s }, txt: { ...init.txt }, pk: {} };
  sc.states = sc.steps.map(st => {
    cur = { vis: { ...cur.vis }, s: { ...cur.s }, txt: { ...cur.txt }, pk: cur.pk };
    (st.show || []).forEach(i => cur.vis[i] = true);
    (st.hide || []).forEach(i => cur.vis[i] = false);
    Object.assign(cur.s, st.set || {}); Object.assign(cur.txt, st.txt || {});
    const pk = {};
    for (const [id, p] of Object.entries(cur.pk)) pk[id] = { ...p, x0: p.x, y0: p.y };
    for (const [id, p] of Object.entries(st.pkt || {})) {
      const prev = cur.pk[id], from = p.from || (prev && prev.vis ? [prev.x, prev.y] : p.to);
      pk[id] = { x0: from[0], y0: from[1], x: p.to[0], y: p.to[1], label: p.label ?? (prev ? prev.label : ''), vis: true };
    }
    (st.hidePkt || []).forEach(i => { if (pk[i]) pk[i].vis = false; });
    cur.pk = pk;
    return cur;
  });
  sc.durs = sc.steps.map(durOf);
  sc.starts = sc.durs.reduce((a, d, i) => (a.push(i ? a[i - 1] + sc.durs[i - 1] : 0), a), []);
  sc.total = sc.starts.at(-1) + sc.durs.at(-1);
}
const ease = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
function paint(root, sc, k, t) {
  const st = sc.states[k];
  for (const [id, v] of Object.entries(st.vis)) root.querySelector('#' + id)?.classList.toggle('off', !v);
  for (const [id, v] of Object.entries(st.s)) { const el = root.querySelector('#' + id); if (el) v ? el.setAttribute('data-s', v) : el.removeAttribute('data-s'); }
  for (const [id, v] of Object.entries(st.txt)) { const el = root.querySelector('#' + id); if (el && el.textContent !== v) el.textContent = v; }
  root.querySelectorAll('.pkt').forEach(g => {
    const p = st.pk[g.id];
    if (!p || !p.vis) { g.classList.add('off'); return; }
    g.classList.remove('off');
    const f = ease(Math.min(1, Math.max(0, (t - 0.2) / 0.9)));
    g.setAttribute('transform', `translate(${p.x0 + (p.x - p.x0) * f} ${p.y0 + (p.y - p.y0) * f})`);
    const tx = g.querySelector('text');
    if (tx.textContent !== p.label) {
      tx.textContent = p.label;
      const w = p.label.length * 7.6 + 26, r = g.querySelector('rect');
      r.setAttribute('x', -w / 2); r.setAttribute('width', w);
    }
  });
}

    ['Por qué DNS', ['Las computadoras solo se conectan por IP. Las personas recuerdan nombres.', 'La IP cambia cuando paras o arrancas una instancia EC2. Con DNS actualizas un registro y todos siguen a la IP nueva.']],
    ['Qué es nslookup y cómo funciona', ['Un comando que pregunta a un servidor DNS por los registros de un nombre y muestra la respuesta.', 'Si no indicas un servidor, pregunta a tu resolver por defecto (/etc/resolv.conf).', '"Non-authoritative answer" significa que la respuesta vino de la caché de un resolver, no del dueño del dominio.'], 1],
    ['Hosted zone de Route 53', ['Una hosted zone es la carpeta de registros DNS de un dominio en AWS Route 53.', 'Zona pública: responde a internet. Zona privada: solo dentro de tu VPC.', 'AWS añade 4 registros NS + 1 SOA por ti. Tú añades registros A, CNAME y MX. Coste: 0,50 $ por zona al mes.']],
  ]],
  pt: ['DNS em resumo', [
    ['O que é o DNS', ['O DNS (Domain Name System) transforma um nome como abhignadevops.store num endereço IP como 203.0.113.10.', 'É a lista de contactos da internet.']],
    ['Porquê DNS', ['Os computadores só se ligam por IP. As pessoas lembram-se de nomes.', 'O IP muda quando paras ou arrancas uma instância EC2. Com DNS atualizas um registo e todos seguem para o IP novo.']],
    ['O que é o nslookup e como funciona', ['Um comando que pergunta a um servidor DNS pelos registos de um nome e mostra a resposta.', 'Se não indicares um servidor, pergunta ao teu resolver por defeito (/etc/resolv.conf).', '"Non-authoritative answer" significa que a resposta veio da cache de um resolver, não do dono do domínio.'], 1],
    ['Hosted zone do Route 53', ['Uma hosted zone é a pasta de registos DNS de um domínio no AWS Route 53.', 'Zona pública: responde à internet. Zona privada: só dentro da tua VPC.', 'A AWS adiciona 4 registos NS + 1 SOA por ti. Tu adicionas registos A, CNAME e MX. Custo: 0,50 $ por zona por mês.']],
  ]],
};
function renderNotes() {
  const [h, cards] = NOTES[lang];
  $('notes-h').textContent = h; $('notes').lang = lang;
  $('ncards').innerHTML = cards.map(([t, ps, code]) => `<article class="ncard"><h3>${esc(t)}</h3>${ps.map(x => `<p>${esc(x)}</p>`).join('')}${code ? `<pre>${esc(NSLOOKUP)}</pre>` : ''}</article>`).join('');
}

/* ---------- play bar ---------- */
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function syncBar() { if (rec) return; if (!scrubbing) $('seek').value = pos; $('time').textContent = `${mmss(pos)} / ${mmss(TL.total)}`; }
function marks() {
  if (rec) return;
  $('seek').max = TL.total;
  $('track').querySelectorAll('.mk').forEach(m => m.remove());
  TL.sceneStart.slice(1).forEach(x => { const m = document.createElement('span'); m.className = 'mk'; m.style.left = (x / TL.total * 100) + '%'; $('track').appendChild(m); });
}
$('seek').addEventListener('input', () => { scrubbing = true; audio.pause(); setT(Number($('seek').value)); });
$('seek').addEventListener('change', () => { scrubbing = false; setT(Number($('seek').value)); if (playing && audioOK) audio.play().catch(() => {}); });

/* ---------- wiring ---------- */
TL = buildTL(lang);
$('scenes').innerHTML = SCENES.map((s, i) => `<button><span>${i + 1}</span>${esc(titleOf(s))}</button>`).join('');
[...$('scenes').children].forEach((b, i) => b.onclick = () => setT(TL.sceneStart[i]));
$('prev').onclick = () => stepBy(-1); $('next').onclick = () => stepBy(1);
$('back5').onclick = () => seekBy(-5); $('fwd5').onclick = () => seekBy(5);
$('play').onclick = togglePlay; $('voice').onclick = toggleVoice; $('fs').onclick = fullscreen;
$('lang').value = lang; $('lang').onchange = e => setLang(e.target.value);
$('speed').onchange = e => { speed = Number(e.target.value); audio.playbackRate = speed; };
document.addEventListener('keydown', e => {
  if (e.target.closest('button, select, input') && (e.key === ' ' || e.key === 'Enter' || e.target.tagName !== 'BUTTON')) return;
  if (e.shiftKey && e.key === 'ArrowRight') seekBy(5); else if (e.shiftKey && e.key === 'ArrowLeft') seekBy(-5);
  else if (e.key === 'ArrowRight') stepBy(1); else if (e.key === 'ArrowLeft') stepBy(-1);
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key.toLowerCase() === 'm') toggleVoice();
  else if (e.key.toLowerCase() === 'l') { const c = Object.keys(LANGS); setLang(c[(c.indexOf(lang) + 1) % c.length]); }
  else if (e.key.toLowerCase() === 'f') fullscreen();
});

/* hooks for the recorder and the voice builder */
window.__film = () => TL.total;
window.__seek = x => { pos = x; render(); };
window.__caps = () => Object.fromEntries(Object.keys(LANGS).map(l => [l, SCENES.map(sc => sc.steps.map(st => l === 'en' ? st.cap : st[l]))]));

marks(); renderNotes(); render();
if (!rec) { loadAudio(lang); requestAnimationFrame(tick); }
</script>
